name: CI

on:
  push:
    # main plus the autopilot release/work branches, so a pushed branch gets
    # the full run before it is merged.
    branches: [main, 'autopilot/**']
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff==0.17.1
      - name: Ruff lint
        run: ruff check --output-format=github .

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Audit the pinned requirements
        # --no-deps: audit exactly the pins (transitive deps are unpinned, so
        # resolving them would audit whatever the index serves that day).
        run: |
          pip-audit --no-deps --disable-pip -r requirements.txt
          pip-audit --no-deps --disable-pip -r requirements-postgres.txt
          pip-audit --no-deps --disable-pip -r requirements-dev.txt

  test:
    # The platforms the README claims: Linux (3.11 + 3.12) and Windows (3.12).
    name: Tests (pytest, ${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12']
        include:
          - os: windows-latest
            python-version: '3.12'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install Chromium for the Playwright end-to-end tests
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi
      - name: Byte-compile all modules
        run: python -m compileall -q statlee wsgi.py
      - name: Run test suite
        env:
          APP_ENV: testing
        run: python -m pytest -q -rs

  sandbox-docker:
    name: Sandbox (real Docker runner image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Build the runner image
        run: docker build -f runner.Dockerfile -t statlee-runner .
      - name: Run the sandbox tests, real-Docker ones included
        env:
          APP_ENV: testing
        run: |
          set -o pipefail
          pytest -rs tests/test_sandbox.py | tee sandbox.log
          if grep -q "Docker daemon unreachable" sandbox.log; then
            echo "::error::the real-Docker sandbox tests were skipped"
            exit 1
          fi

  docker-image:
    name: App image builds, runs non-root, carries no secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the app image
        run: docker build -t statlee-web .
      - name: Check the runtime user and the build context
        run: |
          test "$(docker run --rm statlee-web id -u)" != "0"
          docker run --rm statlee-web sh -c 'test ! -e /app/.env && test ! -e /app/.git && test ! -d /app/tests'

  postgres:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway credentials for an ephemeral CI-only service container.
          POSTGRES_USER: statlee
          POSTGRES_PASSWORD: statlee-ci
          POSTGRES_DB: statlee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statlee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-postgres.txt
      - name: Boot migrations against PostgreSQL
        env:
          APP_ENV: testing
          STATLEE_TEST_POSTGRES_URL: postgresql+psycopg://statlee:statlee-ci@localhost:5432/statlee
        run: |
          set -o pipefail
          pytest -rs tests/test_postgres_migrations.py | tee pg.log
          if grep -q "STATLEE_TEST_POSTGRES_URL not set" pg.log; then
            echo "::error::the PostgreSQL migration test was skipped"
            exit 1
          fi

  migrations:
    name: Migrations match the models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Upgrade a scratch DB to head and diff it against the models
        env:
          APP_ENV: development
          DATABASE_URL: sqlite:///${{ runner.temp }}/check.db
          UPLOAD_ROOT: ${{ runner.temp }}/uploads
        run: |
          flask --app wsgi db upgrade
          flask --app wsgi db check
          flask --app wsgi statlee-doctor

  readme-setup:
    # MIRRORS THE README "Quickstart" STEPS. Edit this job and that README
    # section together: each step below is one README line, run on a clean
    # runner with the .env.example placeholder key (no real secret). Booting
    # for /health never calls an LLM: provider clients are created lazily on
    # the first generation request.
    name: README setup steps (${{ matrix.path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: [docker-compose, local-venv]
    steps:
      - uses: actions/checkout@v7

      # --- README: Quickstart (Docker) ------------------------------------
      - name: "cp .env.example .env"
        if: matrix.path == 'docker-compose'
        run: cp .env.example .env
      - name: "docker compose up --build"
        if: matrix.path == 'docker-compose'
        run: docker compose up -d --build
      - name: "open http://localhost:5000"
        if: matrix.path == 'docker-compose'
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/health; then
              echo
              curl -fsS -o /dev/null -w 'GET / -> %{http_code}' http://localhost:5000/
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Stop the compose stack
        if: always() && matrix.path == 'docker-compose'
        run: docker compose down -v

      # --- README: run locally without Docker ------------------------------
      - uses: actions/setup-python@v7
        if: matrix.path == 'local-venv'
        with:
          python-version-file: .python-version
      - name: "python -m venv venv && source venv/bin/activate; pip install -r requirements.txt"
        if: matrix.path == 'local-venv'
        run: |
          python -m venv venv && source venv/bin/activate
          pip install -r requirements.txt
      - name: "APP_ENV=development python wsgi.py, then open http://localhost:5000"
        if: matrix.path == 'local-venv'
        run: |
          source venv/bin/activate
          APP_ENV=development python wsgi.py > wsgi.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/health; then
              echo
              curl -fsS -o /dev/null -w 'GET / -> %{http_code}' http://localhost:5000/
              kill %1
              exit 0
            fi
            sleep 2
          done
          cat wsgi.log
          exit 1
